<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imposter</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--royal:#0a2d8c;--navy:#041640;--silver:#b4bcc2;--hi:#eef1f3;--green:#2fa35a;--ink:#041640;--white:#fff;--tile:#123aa8;--tile2:#0a2d8c;--tilet:#fff;--dis:#0a1d52;--disb:#3b4a78;--dist:#7d8bb5;--txt:#fff;--cbig:#0a2d8c;--s1:#2fa35a;--s2:#fff;--s3:#b4bcc2;--sw:14px;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--navy) linear-gradient(180deg,var(--royal),var(--navy)) fixed;color:var(--white);
font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:26px 18px 40px}
h1,.d{font-family:'Oswald','Arial Narrow',Impact,sans-serif;margin:0}
header{text-align:center;margin-bottom:18px}
h1{font-size:clamp(40px,10vw,72px);font-weight:700;letter-spacing:.04em;color:var(--txt);text-shadow:0 3px 0 var(--navy)}
h2{font-family:'Oswald',sans-serif;font-size:30px;margin:0 0 14px;color:var(--txt);text-align:center}
.cat{display:inline-block;margin-top:8px;padding:10px 30px;background:linear-gradient(180deg,var(--hi),var(--silver));color:var(--ink);
border-radius:6px;border-bottom:6px solid var(--green);font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(24px,6vw,40px)}
.sub{margin:12px 0 0;color:var(--txt);opacity:.88;font-size:18px;text-align:center}
.stack{display:flex;flex-direction:column;gap:16px;max-width:460px;margin:26px auto 0}
.btn{appearance:none;cursor:pointer;border:0;border-radius:8px;padding:18px 28px;font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;
letter-spacing:.04em;background:var(--hi);color:var(--ink);border-bottom:6px solid var(--green)}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--silver)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:12px 20px;font-size:19px}
.btn:focus-visible,.name:focus-visible,.chip:focus-visible,input:focus-visible{outline:4px solid var(--green);outline-offset:3px}
input{width:100%;padding:16px;border-radius:8px;border:3px solid var(--silver);background:var(--hi);color:var(--ink);font:600 22px 'Barlow',sans-serif}
.row{display:flex;gap:10px;margin:14px 0}
.row input{flex:1;min-width:0}
.form{max-width:460px;margin:0 auto}
label{display:block;margin:16px 0 6px;color:var(--txt);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px;justify-content:center}
.chip,.tgc{appearance:none;cursor:pointer;border:2px solid var(--silver);border-radius:999px;padding:10px 18px;background:transparent;color:var(--txt);
font:600 18px 'Barlow',sans-serif}
.chip.on,.tgc.on{background:var(--hi);color:var(--ink);border-color:var(--green);border-bottom-width:4px}
.plist{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border:2px solid var(--silver);border-radius:8px;
background:rgba(255,255,255,.06);font-size:22px;font-weight:600}
.plist .x{appearance:none;border:0;background:transparent;color:var(--silver);font-size:26px;cursor:pointer;padding:0 6px}
.tag{font-size:16px;color:var(--green);font-weight:600}
.code{text-align:center;margin:6px 0 4px;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(54px,16vw,96px);letter-spacing:.18em;color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.name{appearance:none;cursor:pointer;border:3px solid var(--silver);border-radius:10px;min-height:116px;padding:10px;
background:linear-gradient(180deg,var(--tile),var(--tile2));color:var(--tilet);font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(26px,6vw,40px);
box-shadow:0 6px 0 var(--navy);transition:transform .12s}
.name:active{transform:translateY(4px)}
.name[disabled]{cursor:default;background:var(--dis);border-color:var(--disb);color:var(--dist);box-shadow:none}
.name small{display:block;font:600 16px 'Barlow',sans-serif;color:var(--green);margin-top:4px}
.foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.msg{min-height:24px;text-align:center;color:#ffd27a;font-size:18px;margin-top:12px}
.overlay{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(2,10,32,.93)}
.overlay.on{display:flex}
.card{width:min(560px,100%);text-align:center;padding:30px 22px 26px;border-radius:14px;background:linear-gradient(180deg,var(--hi),var(--silver));
color:var(--ink);border:6px solid var(--royal);box-shadow:0 0 0 4px var(--silver),0 20px 50px rgba(0,0,0,.6)}
.card .who{font-size:clamp(30px,7vw,44px);font-weight:700}
.card .cc{font-size:22px;font-weight:600;margin:6px 0 18px}
.card .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(44px,13vw,86px);line-height:1.05;margin:10px 0;color:var(--cbig);word-break:break-word}
.card.imp .big{color:var(--tilet);background:var(--tile2);padding:8px 10px;border-radius:6px;border-bottom:8px solid var(--green)}
.hint{font-size:24px;font-weight:600;margin:14px 0 6px}
.hint b{font-family:'Oswald',sans-serif;font-size:34px;color:var(--cbig)}
.note{font-size:18px;margin:12px 0 22px;color:var(--ink)}
.card .btn{background:var(--tile2);color:var(--tilet)}
.btn.red,.card .btn.red{background:#d32f2f;color:#fff;border:0;border-bottom:6px solid #7f1414}
.btn.sm.red{border-bottom-width:5px}
.wrap{position:relative;z-index:1}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;display:none;z-index:0;pointer-events:none}
header::after,.card::before{content:"";display:block;height:14px;background:repeating-linear-gradient(135deg,var(--s1) 0 var(--sw),var(--s2) var(--sw) calc(var(--sw)*2),var(--s3) calc(var(--sw)*2) calc(var(--sw)*3));border-radius:3px}
header::after{max-width:420px;margin:14px auto 0}
.card::before{margin:-14px -6px 16px}

.cutwrap{max-width:420px;margin:0 auto 6px;padding:10px;border-radius:12px;background:radial-gradient(circle,rgba(255,255,255,.18) 2px,transparent 2.5px) 0 0/14px 14px;text-align:center}
.cut{display:block;margin:0 auto;max-height:230px;max-width:70%;transform:rotate(-2deg);filter:drop-shadow(6px 0 0 var(--s2)) drop-shadow(-6px 0 0 var(--green)) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--hi);overflow:hidden;color:#fff;font-family:'Oswald',sans-serif;font-weight:700;vertical-align:middle;box-shadow:0 0 0 3px var(--green)}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}
.sw{appearance:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--hi);cursor:pointer;padding:0}
.sw.on{outline:4px solid var(--green);outline-offset:2px}
.center{display:flex;justify-content:center;margin:8px 0}

.wrap{position:relative;z-index:1}
#corners{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cf{filter:drop-shadow(-5px 0 0 var(--s2)) drop-shadow(5px 0 0 var(--green)) drop-shadow(0 6px 8px rgba(0,0,0,.5))}
#corners img{opacity:.9}
@media (max-width:1100px){#corners img{opacity:.4}}
.strip{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:8px 0 12px}
.strip img{height:clamp(84px,16vw,130px);width:auto}
.strip img:nth-child(1){transform:rotate(-4deg)}.strip img:nth-child(2){transform:translateY(-6px) rotate(2deg)}.strip img:nth-child(3){transform:rotate(5deg)}
img.mini{display:block;height:90px;width:auto;margin:-6px auto 8px}
.tro{color:#ffd24a;font-family:'Oswald',sans-serif;font-weight:700;font-size:.62em;white-space:nowrap;text-shadow:0 1px 0 #041640}
.name small.rec,.rec{color:var(--silver);font-weight:600}
.plist .rec{margin-left:6px;font-style:normal}
.rec2{font-weight:700;font-size:20px;margin:6px 0 14px;color:var(--ink)}

body::before,body::after{content:"";position:fixed;left:0;right:0;height:30px;z-index:6;--sw:36px;background:repeating-linear-gradient(135deg,var(--s1) 0 var(--sw),var(--s2) var(--sw) calc(var(--sw)*2),var(--s3) calc(var(--sw)*2) calc(var(--sw)*3));pointer-events:none}
body::before{top:env(safe-area-inset-top,0px)}
body::after{bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding-top:56px;padding-bottom:72px}
.pt{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:3px solid #888;overflow:hidden;vertical-align:middle;margin-right:8px;flex:none;color:#fff;font:700 20px 'Oswald',sans-serif}
.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
button.pp,button.pp2{appearance:none;background:transparent;border:0;padding:0;cursor:pointer}
.pp2.on .pt{outline:4px solid var(--green);outline-offset:3px}
.who2{display:flex;align-items:center;gap:6px}
.pick8{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:8px 0 18px}
.name[disabled]{opacity:.78}
.name .pt{margin-right:10px}
.pcl{position:relative;display:inline-block;overflow:hidden}
.pcl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.lbn{font-family:'Oswald',sans-serif;font-weight:700;min-width:30px;display:inline-block}
</style>

function nk(n){return String(n).trim().toLowerCase().slice(0,20)}
function cl(x){return Math.max(0,Math.min(999,(+x)|0))}
function ent(m,name){var k=nk(name);return m[k]||(m[k]={n:String(name).slice(0,20),iw:0,w:0,l:0})}
function sc(m,name){return m[nk(name)]||{iw:0,w:0,l:0}}
function recStr(m,name){var e=sc(m,name);return "("+e.w+"-"+e.l+")"}

else{hc.on("data",function(d){if(!d)return;
